version: "3.9"

# Local dev — all infra runs locally in containers.
# Images are served via local minio (not the in-cluster one which is unreachable from laptop).
# Woodpecker and zot are public and reachable, but not needed for local dev.
#
# Usage:
#   docker compose up --build
#   Upload:   curl -F file=@photo.jpg -F board=b http://localhost:8081/upload
#   Browse:   http://localhost:8082/boards/b
#   Frontend: http://localhost:3000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lolcatz
      POSTGRES_USER: lolcatz
      POSTGRES_PASSWORD: lolcatz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lolcatz"]
      interval: 5s
      retries: 10

  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    ports:
      - "6379:6379"

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers=localhost:9644 2>/dev/null"]
      interval: 10s
      retries: 15

  redpanda-init:
    image: redpandadata/redpanda:latest
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: |
      /bin/bash -c "
        rpk topic create lolcatz-images --brokers redpanda:29092 || true
        rpk topic create lolcatz-tags   --brokers redpanda:29092 || true
      "

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/lolcatz-images
        mc anonymous set download local/lolcatz-images
      "

  uploader:
    build:
      context: services/uploader
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redpanda-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://lolcatz:lolcatz@postgres:5432/lolcatz?sslmode=disable
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: lolcatz-images
      # Public URL used to build image links — points to local minio
      S3_PUBLIC_URL: http://localhost:9000
      KAFKA_BROKERS: redpanda:29092
      PORT: "8080"
    ports:
      - "8081:8080"

  browse:
    build:
      context: services/browse
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lolcatz:lolcatz@postgres:5432/lolcatz?sslmode=disable
      S3_PUBLIC_URL: http://localhost:9000
      PORT: "8080"
    ports:
      - "8082:8080"

  search:
    build:
      context: services/search
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lolcatz:lolcatz@postgres:5432/lolcatz?sslmode=disable
      S3_PUBLIC_URL: http://localhost:9000
      PORT: "8080"
    ports:
      - "8083:8080"

  comments:
    build:
      context: services/comments
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lolcatz:lolcatz@postgres:5432/lolcatz?sslmode=disable
      PORT: "8080"
    ports:
      - "8084:8080"

  tagger:
    build:
      context: services/tagger
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:29092
      KAFKA_TOPIC_IN: lolcatz-images
      KAFKA_TOPIC_OUT: lolcatz-tags
      DATABASE_URL: postgres://lolcatz:lolcatz@postgres:5432/lolcatz?sslmode=disable
      # Tagger fetches images from minio directly
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: lolcatz-images

  frontend:
    build:
      context: frontend
    depends_on:
      - uploader
      - browse
      - search
      - comments
    environment:
      UPLOADER_URL: http://uploader:8080
      BROWSE_URL: http://browse:8080
      SEARCH_URL: http://search:8080
      COMMENTS_URL: http://comments:8080
      # Shown to browser — local minio
      S3_PUBLIC_URL: http://localhost:9000
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  minio_data:
