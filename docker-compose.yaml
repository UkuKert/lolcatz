# Local dev — all infra runs locally in containers.
# Images are served via local minio (not the in-cluster one which is unreachable from laptop).
# Woodpecker and zot are public and reachable, but not needed for local dev.
#
# Usage:
#   docker compose up --build
#   Stop:     docker compose down
#   Browse:   http://localhost:8082/boards/b
#   Frontend: http://localhost:3000

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lolcatz
      POSTGRES_USER: lolcatz
      POSTGRES_PASSWORD: lolcatz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lolcatz -d lolcatz"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:latest
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers=localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15

  redpanda-init:
    image: redpandadata/redpanda:latest
    entrypoint: |
      /bin/bash -c "
        until rpk cluster info --brokers redpanda:29092 >/dev/null 2>&1; do sleep 2; done
        rpk topic create lolcatz-images --brokers redpanda:29092 || true
        rpk topic create lolcatz-tags   --brokers redpanda:29092 || true
      "

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint: |
      /bin/sh -c "
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done
        mc mb --ignore-existing local/lolcatz-images
        mc anonymous set download local/lolcatz-images
      "

  uploader:
    build:
      context: services/uploader
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://lolcatz:lolcatz@postgres:5432/lolcatz?sslmode=disable
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: lolcatz-images
      # Public URL used to build image links — points to local minio
      S3_PUBLIC_URL: http://localhost:9000
      KAFKA_BROKERS: redpanda:29092
      DEV_AUTH_TOKEN: lolcatz-local
      DEV_AUTH_EMAIL: developer@localhost
      PORT: "8080"
    ports:
      - "8081:8080"
    networks:
      default:
        aliases: [lolcatz-uploader]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  browse:
    build:
      context: services/browse
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://lolcatz:lolcatz@postgres:5432/lolcatz?sslmode=disable
      S3_ENDPOINT: minio:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: lolcatz-images
      PORT: "8080"
    ports:
      - "8082:8080"
    networks:
      default:
        aliases: [lolcatz-browse]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  search:
    build:
      context: services/search
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://lolcatz:lolcatz@postgres:5432/lolcatz?sslmode=disable
      S3_PUBLIC_URL: http://localhost:9000
      S3_BUCKET: lolcatz-images
      PORT: "8080"
    ports:
      - "8083:8080"
    networks:
      default:
        aliases: [lolcatz-search]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  comments:
    build:
      context: services/comments
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://lolcatz:lolcatz@postgres:5432/lolcatz?sslmode=disable
      DEV_AUTH_TOKEN: lolcatz-local
      DEV_AUTH_EMAIL: developer@localhost
      PORT: "8080"
    ports:
      - "8084:8080"
    networks:
      default:
        aliases: [lolcatz-comments]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  tagger:
    profiles: ["ai"]
    build:
      context: services/tagger
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:29092
      KAFKA_TOPIC_IN: lolcatz-images
      KAFKA_TOPIC_OUT: lolcatz-tags
      DATABASE_URL: postgres://lolcatz:lolcatz@postgres:5432/lolcatz?sslmode=disable
      # Tagger fetches images from minio directly
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: lolcatz-images

  frontend:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_DEV_AUTH_TOKEN: lolcatz-local
    restart: unless-stopped
    environment:
      # Shown to browser — local minio
      S3_PUBLIC_URL: http://localhost:9000
      NEXT_PUBLIC_DEV_AUTH_TOKEN: lolcatz-local
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local-development-only
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  minio_data:
  redis_data:
