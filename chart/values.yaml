domain: can-i-haz-kubernetes

# Registry/namespace prefix for short image names. Full image paths override it.
imageRegistry: ghcr.io/codemowers

# Optional credentials for private GHCR packages. Public packages need none.
imagePullSecrets: []

uploader:
  image: lolcatz-uploader:latest
browse:
  image: lolcatz-browse:latest
search:
  image: lolcatz-search:latest
comments:
  image: lolcatz-comments:latest
admin:
  enabled: true
  image: lolcatz-admin:latest
tagger:
  image: lolcatz-tagger:latest
taggerModel:
  image: lolcatz-tagger-model:latest
thumbnailer:
  image: lolcatz-thumbnailer:latest
ocr:
  image: lolcatz-ocr:latest
exif:
  image: lolcatz-exif:latest
insightface:
  # Set true when adding the local exercise implementation.
  enabled: false
  image: lolcatz-insightface:latest
insightfaceModel:
  image: lolcatz-insightface-model:latest
frontend:
  image: lolcatz-frontend:latest
