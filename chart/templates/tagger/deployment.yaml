apiVersion: apps/v1
kind: Deployment
metadata:
  name: lolcatz-tagger
  namespace: lolcatz-foobar
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: lolcatz-tagger
  template:
    metadata:
      labels:
        app: lolcatz-tagger
    spec:
      imagePullSecrets:
        - name: zot-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: tagger
          image: {{ .Values.tagger.image }}
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lolcatz-database-app
                  key: uri
            - name: KAFKA_BROKERS
              value: redpanda-0.redpanda.redpanda.svc.cluster.local:9092
            - name: KAFKA_TOPIC_IN
              value: lolcatz-images
            - name: KAFKA_TOPIC_OUT
              value: lolcatz-tags
            # In-cluster minio endpoint (not the public one)
            - name: S3_ENDPOINT
              value: http://minio.minio.svc.cluster.local
            - name: S3_BUCKET
              value: lolcatz-images
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lolcatz-images
                  key: accessKey
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lolcatz-images
                  key: secretKey
            - name: YOLO_CONF_THRESHOLD
              value: "0.4"
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "2"
