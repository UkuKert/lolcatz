apiVersion: apps/v1
kind: Deployment
metadata:
  name: lolcatz-tagger
  namespace: lolcatz
spec:
  replicas: 3
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: lolcatz-tagger
  template:
    metadata:
      labels:
        app: lolcatz-tagger
    spec:
      imagePullSecrets:
        - name: zot-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: yolo-model
          image:
            reference: {{ .Values.taggerModel.image }}
            pullPolicy: IfNotPresent
      containers:
        - name: tagger
          securityContext: { allowPrivilegeEscalation: false }
          image: {{ .Values.tagger.image }}
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lolcatz-database-app
                  key: uri
            - name: KAFKA_BROKERS
              value: lolcatz-redpanda.lolcatz.svc.cluster.local:9093
            - name: KAFKA_TOPIC_IN
              value: lolcatz-images
            - name: KAFKA_TOPIC_OUT
              value: lolcatz-tags
            # In-cluster minio endpoint (not the public one)
            - name: S3_ENDPOINT
              value: http://minio.minio.svc.cluster.local:9000
            - name: S3_BUCKET
              value: {{ .Release.Namespace }}-images
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lolcatz-images
                  key: accessKey
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lolcatz-images
                  key: secretKey
            - name: YOLO_CONF_THRESHOLD
              value: "0.4"
            - name: YOLO_MODEL_PATH
              value: /models/yolov8n.pt
          volumeMounts:
            - name: yolo-model
              mountPath: /models
              readOnly: true
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "2"
