apiVersion: apps/v1
kind: Deployment
metadata:
  name: lolcatz-comments
  namespace: lolcatz
spec:
  replicas: 3
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: lolcatz-comments
  template:
    metadata:
      labels:
        app: lolcatz-comments
    spec:
      imagePullSecrets:
        - name: zot-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: comments
          securityContext: { allowPrivilegeEscalation: false }
          image: {{ .Values.comments.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lolcatz-database-app
                  key: uri
            - name: OIDC_ISSUER
              value: https://auth.ee-lte-1.codemowers.io/
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: lolcatz-comments
  namespace: lolcatz
spec:
  selector:
    app: lolcatz-comments
  ports:
    - port: 8080
      targetPort: 8080
