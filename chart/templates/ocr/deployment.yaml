apiVersion: apps/v1
kind: Deployment
metadata:
  name: lolcatz-ocr
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lolcatz-ocr
  template:
    metadata:
      labels:
        app: lolcatz-ocr
    spec:
      imagePullSecrets:
        - name: zot-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ocr
          securityContext: { allowPrivilegeEscalation: false }
          image: {{ .Values.ocr.image }}
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: lolcatz-database-app, key: uri }
            - name: KAFKA_BROKERS
              value: lolcatz-redpanda.lolcatz.svc.cluster.local:9093
            - name: KAFKA_TOPIC
              value: lolcatz-images
            - name: S3_ENDPOINT
              value: http://minio.minio.svc.cluster.local:9000
            - name: S3_BUCKET
              value: {{ .Release.Namespace }}-images
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: lolcatz-images, key: accessKey }
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: lolcatz-images, key: secretKey }
            - name: OCR_LANGUAGE
              value: eng
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 1Gi, cpu: "2" }
