apiVersion: apps/v1
kind: Deployment
metadata:
  name: lolcatz-search
  namespace: lolcatz-foobar
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: lolcatz-search
  template:
    metadata:
      labels:
        app: lolcatz-search
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: search
          image: {{ .Values.search.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lolcatz-database-app
                  key: uri
            - name: S3_PUBLIC_URL
              value: http://minio.ee-lte-1.codemowers.io
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: lolcatz-search
  namespace: lolcatz-foobar
spec:
  selector:
    app: lolcatz-search
  ports:
    - port: 8080
      targetPort: 8080
