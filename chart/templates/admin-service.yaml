{{- if .Values.admin.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: lolcatz-admin
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: {{ .Release.Namespace }}-lolcatz-admin@kubernetescrd
spec:
  selector:
    app: lolcatz-admin
  ports:
    - name: https
      port: 8080
      targetPort: https
{{- end }}
