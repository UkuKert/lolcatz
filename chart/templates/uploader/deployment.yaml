apiVersion: apps/v1
kind: Deployment
metadata:
  name: lolcatz-uploader
  namespace: lolcatz
spec:
  replicas: 3
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: lolcatz-uploader
  template:
    metadata:
      labels:
        app: lolcatz-uploader
    spec:
      imagePullSecrets:
        - name: zot-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: uploader
          securityContext: { allowPrivilegeEscalation: false }
          image: {{ .Values.uploader.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lolcatz-database-app
                  key: uri
            - name: S3_ENDPOINT
              value: minio.minio.svc.cluster.local:9000
            - name: S3_PUBLIC_URL
              value: https://minio.ee-lte-1.codemowers.io
            {{- with .Values.region }}
            - name: S3_REGION
              value: {{ . | quote }}
            {{- end }}
            - name: S3_BUCKET
              value: {{ .Release.Namespace }}-images
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lolcatz-images
                  key: accessKey
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lolcatz-images
                  key: secretKey
            - name: KAFKA_BROKERS
              value: lolcatz-redpanda.lolcatz.svc.cluster.local:9093
            - name: OIDC_ISSUER
              value: https://auth.ee-lte-1.codemowers.io/
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: lolcatz-uploader
  namespace: lolcatz
spec:
  selector:
    app: lolcatz-uploader
  ports:
    - port: 8080
      targetPort: 8080
