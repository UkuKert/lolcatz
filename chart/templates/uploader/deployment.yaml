apiVersion: apps/v1
kind: Deployment
metadata:
  name: lolcatz-uploader
  namespace: lolcatz-foobar
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: lolcatz-uploader
  template:
    metadata:
      labels:
        app: lolcatz-uploader
    spec:
      imagePullSecrets:
        - name: zot-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: uploader
          image: {{ .Values.uploader.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lolcatz-database-app
                  key: uri
            - name: S3_ENDPOINT
              value: minio.ee-lte-1.codemowers.io
            - name: S3_PUBLIC_URL
              value: http://minio.ee-lte-1.codemowers.io
            - name: S3_BUCKET
              value: lolcatz-images
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lolcatz-images
                  key: accessKey
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lolcatz-images
                  key: secretKey
            - name: KAFKA_BROKERS
              value: redpanda-0.redpanda.redpanda.svc.cluster.local:9092
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: lolcatz-uploader
  namespace: lolcatz-foobar
spec:
  selector:
    app: lolcatz-uploader
  ports:
    - port: 8080
      targetPort: 8080
