apiVersion: v1
kind: ServiceAccount
metadata:
  name: kaniko
  namespace: lolcatz
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kaniko
  namespace: lolcatz
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kaniko
  namespace: lolcatz
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kaniko
subjects:
  - kind: ServiceAccount
    name: kaniko
    namespace: lolcatz
