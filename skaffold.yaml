apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: lolcatz-foobar

build:
  # Builds run in-cluster via kaniko, pushing to zot.ee-lte-1.codemowers.io.
  # Prerequisites:
  #   kubectl create ns lolcatz-foobar
  #   kubectl create secret docker-registry zot-push-secret -n lolcatz-foobar \
  #     --docker-server=zot.ee-lte-1.codemowers.io \
  #     --docker-username=<your-email> \
  #     --docker-password=<zot-api-key>
  cluster:
    namespace: lolcatz-foobar
    serviceAccount: kaniko
    dockerConfig:
      secretName: zot-push-secret
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "4Gi"

  artifacts:
    - image: zot.ee-lte-1.codemowers.io/matmlazi/lolcatz-foobar/uploader
      context: services/uploader
      kaniko:
        dockerfile: Dockerfile
    - image: zot.ee-lte-1.codemowers.io/matmlazi/lolcatz-foobar/browse
      context: services/browse
      kaniko:
        dockerfile: Dockerfile
    - image: zot.ee-lte-1.codemowers.io/matmlazi/lolcatz-foobar/search
      context: services/search
      kaniko:
        dockerfile: Dockerfile
    - image: zot.ee-lte-1.codemowers.io/matmlazi/lolcatz-foobar/comments
      context: services/comments
      kaniko:
        dockerfile: Dockerfile
    - image: zot.ee-lte-1.codemowers.io/matmlazi/lolcatz-foobar/tagger
      context: services/tagger
      kaniko:
        dockerfile: Dockerfile
    - image: zot.ee-lte-1.codemowers.io/matmlazi/lolcatz-foobar/frontend
      context: frontend
      kaniko:
        dockerfile: Dockerfile

deploy:
  helm:
    releases:
      - name: lolcatz-foobar
        chartPath: chart
        valuesFiles:
          - chart/values.yaml
        setValueTemplates:
          uploader.image: "zot.ee-lte-1.codemowers.io/matmlazi/lolcatz-foobar/uploader:{{.IMAGE_TAG_zot_ee_lte_1_codemowers_io_matmlazi_lolcatz_foobar_uploader}}"
          browse.image: "zot.ee-lte-1.codemowers.io/matmlazi/lolcatz-foobar/browse:{{.IMAGE_TAG_zot_ee_lte_1_codemowers_io_matmlazi_lolcatz_foobar_browse}}"
          search.image: "zot.ee-lte-1.codemowers.io/matmlazi/lolcatz-foobar/search:{{.IMAGE_TAG_zot_ee_lte_1_codemowers_io_matmlazi_lolcatz_foobar_search}}"
          comments.image: "zot.ee-lte-1.codemowers.io/matmlazi/lolcatz-foobar/comments:{{.IMAGE_TAG_zot_ee_lte_1_codemowers_io_matmlazi_lolcatz_foobar_comments}}"
          tagger.image: "zot.ee-lte-1.codemowers.io/matmlazi/lolcatz-foobar/tagger:{{.IMAGE_TAG_zot_ee_lte_1_codemowers_io_matmlazi_lolcatz_foobar_tagger}}"
          frontend.image: "zot.ee-lte-1.codemowers.io/matmlazi/lolcatz-foobar/frontend:{{.IMAGE_TAG_zot_ee_lte_1_codemowers_io_matmlazi_lolcatz_foobar_frontend}}"
        namespace: lolcatz-foobar
        createNamespace: true

portForward:
  - resourceType: service
    resourceName: lolcatz-frontend
    namespace: lolcatz-foobar
    port: 3000
    localPort: 3000
  - resourceType: service
    resourceName: lolcatz-uploader
    namespace: lolcatz-foobar
    port: 8080
    localPort: 8081
